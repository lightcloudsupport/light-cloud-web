<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#030c2e;--card:rgba(80,140,255,.12);--line:rgba(150,190,255,.22);--tx:#eaf2ff;--mu:#93aad6;--ac:#5aa2ff;--ac2:#a5d0ff;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
nav,main,footer{position:relative;z-index:1}
nav{position:sticky;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;backdrop-filter:blur(12px);background:rgba(5,6,15,.55);border-bottom:1px solid var(--line);z-index:5}
.logo{font-weight:800;letter-spacing:.12em;color:var(--tx);text-decoration:none}
.logo span{color:var(--ac)}
nav a.l{color:var(--mu);text-decoration:none;font-size:14px}
.btn{display:inline-block;padding:12px 24px;border-radius:999px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#0a0b1e!important;font-weight:700;text-decoration:none}
main{max-width:1150px;margin:auto;padding:60px 5vw 80px}
h1{font-size:clamp(34px,6vw,56px);margin:0 0 10px;text-align:center}
h1 em{font-style:normal;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);text-align:center;margin:0 0 30px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}
.tab{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mu);cursor:pointer;font-size:14px;font-family:inherit}
.tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#0a0b1e;border-color:transparent;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center;backdrop-filter:blur(10px);transition:transform .25s,border-color .25s}
@media (hover:hover){.card:hover{transform:translateY(-6px);border-color:var(--ac)}}
.card.hot{border-color:var(--ac);box-shadow:0 0 40px rgba(139,156,255,.18)}
.card h3{margin:0}
.price{font-size:42px;font-weight:800;margin:10px 0 2px}
.price small{font-size:14px;color:var(--mu);font-weight:500}
.ram{color:var(--ac);font-weight:700;margin-bottom:14px}
.card ul{list-style:none;padding:0;margin:0 0 20px;color:var(--mu);font-size:14px;line-height:2}
h2{text-align:center;margin:70px 0 20px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);backdrop-filter:blur(10px)}
table{width:100%;border-collapse:collapse;min-width:520px;font-size:14px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--ac);font-weight:700}
td{color:var(--mu)}
td:first-child{color:var(--tx);font-weight:700}
tr:last-child td{border-bottom:0}
.old{color:var(--mu);text-decoration:line-through;font-size:16px;margin-right:6px}.off{display:inline-block;margin-top:2px;padding:3px 10px;border-radius:999px;background:rgba(139,156,255,.15);color:var(--ac);font-size:12px;font-weight:700}
.vf{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}.vf span{padding:8px 14px;border:1px solid var(--line);border-radius:999px;color:var(--mu);font-size:14px}
footer{text-align:center;padding:40px 5vw;color:var(--mu);border-top:1px solid var(--line);font-size:14px}

html{overflow-x:hidden}

.orb{position:fixed;border-radius:50%;z-index:0;pointer-events:none;background:linear-gradient(200deg,#3a8fff 0%,#1a52d8 55%,#0c2f93 100%)}
.o1{width:min(52vw,640px);height:min(52vw,640px);top:-9vw;right:-8vw;animation:fl 14s ease-in-out infinite}
.o2{width:clamp(110px,20vw,240px);height:clamp(110px,20vw,240px);bottom:-5vw;left:-4vw;animation:fl 11s ease-in-out infinite reverse}
@keyframes fl{50%{transform:translate(-14px,18px)}}
.brand{position:relative;z-index:1;padding:calc(92px + env(safe-area-inset-top,0px)) 5vw 0;text-align:center;font-weight:800;letter-spacing:.14em}
.brand span{color:#4f9bff}
.dock{position:fixed;z-index:20;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:6px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.dock a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#7db8ff;text-decoration:none;transition:.2s}
.dock a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dock a:hover{color:#fff}
.dock a.on{background:linear-gradient(135deg,#3b8cff,#1b49c9);color:#fff;box-shadow:0 4px 16px rgba(59,140,255,.6)}
.btn{background:linear-gradient(135deg,#3b8cff,#1b49c9);color:#fff!important;box-shadow:0 6px 24px rgba(37,99,235,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.ghost{background:rgba(255,255,255,.06);box-shadow:none}
.tab.on{color:#fff}
.card{background:linear-gradient(160deg,rgba(80,140,255,.16),rgba(255,255,255,.04));border:1px solid rgba(150,190,255,.25)}
.plan.hot,.card.hot{background:linear-gradient(160deg,rgba(59,140,255,.42),rgba(27,73,201,.25));border-color:#5aa2ff;box-shadow:0 0 50px rgba(59,140,255,.3)}
.price{color:#fff}.ram{color:#7db8ff}
.off{background:rgba(59,140,255,.25);color:#bcd9ff}

body{background:linear-gradient(180deg,#01030a 0%,#050d24 60%,#040a1a 100%)}
.land{position:fixed;left:0;right:0;bottom:0;width:100%;height:26vh;z-index:0;pointer-events:none}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
 if(!window.THREE)return;
 var cv=document.getElementById('bg');
 var r=new THREE.WebGLRenderer({canvas:cv,antialias:false,alpha:true});
 r.setPixelRatio(Math.min(devicePixelRatio,2));
 var sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,200);cam.position.z=9;
 function tex(){var c=document.createElement('canvas');c.width=c.height=16;var x=c.getContext('2d');
  for(var i=0;i<16;i++)for(var j=0;j<16;j++){var v=170+Math.random()*85|0;x.fillStyle='rgb('+(v-40)+','+(v-12)+','+v+')';x.fillRect(i,j,1,1)}
  var t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;return t}
 var cols=[0xffffff,0x9db9d8,0x86a9cf,0x5f84ac,0xe0ecf9,0x90adcb];
 var moon=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.6,2.6),cols.map(function(c){return new THREE.MeshBasicMaterial({map:tex(),color:c})}));
 moon.rotation.set(.62,.78,0);sc.add(moon);
 var g=document.createElement('canvas');g.width=g.height=256;var gx=g.getContext('2d');
 var gr=gx.createRadialGradient(128,128,10,128,128,128);gr.addColorStop(0,'rgba(140,185,255,.55)');gr.addColorStop(1,'rgba(140,185,255,0)');
 gx.fillStyle=gr;gx.fillRect(0,0,256,256);
 var glow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(g),blending:THREE.AdditiveBlending,depthWrite:false}));
 glow.scale.set(13,13,1);glow.position.z=-1;sc.add(glow);
 function stars(n,s,sp,col){var geo=new THREE.BufferGeometry(),a=new Float32Array(n*3);for(var i=0;i<n*3;i++)a[i]=(Math.random()-.5)*sp;
  geo.setAttribute('position',new THREE.BufferAttribute(a,3));return new THREE.Points(geo,new THREE.PointsMaterial({color:col,size:s,transparent:true}))}
 var s1=stars(1600,.07,120,0xffffff),s2=stars(420,.13,90,0xbcd4ff);sc.add(s1,s2);
 var clouds=[];for(var i=0;i<6;i++){var c=new THREE.Mesh(new THREE.BoxGeometry(3+Math.random()*3,.25,1.2),new THREE.MeshBasicMaterial({color:0x0d1c3d,transparent:true,opacity:.55}));
  c.position.set((Math.random()-.5)*26,-1.5+Math.random()*4,-6-Math.random()*6);c.userData.v=.004+Math.random()*.006;sc.add(c);clouds.push(c)}
 var mx=0,my=0,sy=0,bx=0,by=0;
 addEventListener('pointermove',function(e){if(e.pointerType!=='mouse')return;mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
 addEventListener('scroll',function(){sy=scrollY});
 function size(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
  var m=innerWidth<700;bx=m?0:0;by=m?1.6:.9;moon.scale.setScalar(m?.7:1);glow.scale.setScalar(m?9:13)}
 addEventListener('resize',size);size();
 var clk=new THREE.Clock();
 (function loop(){var t=clk.getElapsedTime();
  moon.rotation.y=.78+t*.18;moon.position.set(bx,by+Math.sin(t*.8)*.18,0);glow.position.set(bx,by,-1);
  s1.rotation.y=t*.004;s2.rotation.y=-t*.006;s2.material.opacity=.65+.35*Math.sin(t*1.7);
  clouds.forEach(function(c){c.position.x+=c.userData.v;if(c.position.x>14)c.position.x=-14});
  cam.position.x+=(mx*1.1-cam.position.x)*.04;cam.position.y+=(-my*.7-sy*.0010-cam.position.y)*.04;cam.lookAt(0,0,0);
  r.render(sc,cam);requestAnimationFrame(loop)})();
})();
</script>
